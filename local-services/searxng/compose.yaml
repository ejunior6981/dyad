name: dyad-local-search
services:
  searxng:
    image: docker.io/searxng/searxng@sha256:ed29454ec1f7149986d42819b8b75265e545e79dd9187ba241c09f16a0fe56d0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Run start.ps1 to generate the local secret}
      SEARXNG_BASE_URL: http://127.0.0.1:8080/
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
